   title = Deterministic Cossacks
   description : struct.begin
      [*] = ;Three changes:
      [*] = ;
      [*] = ;1. Determinism (10 patches): replaces raw `random` calls in the resource-search and combat hot paths with deterministic SetRandomKey + random seeded from per-unit / per-tick state. Same save reload, same multiplayer state -> identical extraction rates and combat outcomes (within engine-level pathfinding tolerance).
      [*] = ;
      [*] = ;2. Anti-snowball (6 patches): four mechanisms stacked.
      [*] = ;   (a) Spread K raised to 4.0 (stock 0.1/0.125): target with 1 attacker looks 5x farther, 2 attackers -> 9x, 3+ -> gc_MaxInt. Extended to ranged in short-range scan.
      [*] = ;   (b) Injured-penalty x2.5 for hp<50% targets — units skip wounded enemies and pick fresh ones.
      [*] = ;   (c) 2v1 damage penalty: second attacker on the same target deals only 65% damage, reducing kill-rate gain from pile-on.
      [*] = ;   (d) Retarget delay: 0.5 g-sec attackdelay injected after every kill; retarget search gated so the unit idles before joining another fight.
      [*] = ;   Together these should make 100 vs 100 symmetric fights end near 0 vs 0 rather than cascading to 0 vs 40.
      [*] = ;
      [*] = ;3. Headshot flat +12 (musketeers / archers): bHeadShot always fires for eligible units (bCanHeadShot and not bFastHorseBullet) at +12 damage. Average DPS identical to 5%*250=12.5 but zero variance. Horse immunity unchanged.
      [*] = ;
      [*] = ;Patches:
      [*] = ;  lib/misc.script:2790        (FindResourceToExtract: rndind)
      [*] = ;  lib/misc.script:2801        (FindResourceToExtract: wood/stone choice)
      [*] = ;  lib/unit.script:4055        (SearchResourceInRadius: standtime gate)
      [*] = ;  lib/unit.script:4114        (SearchResourceInRadius: bskipcheck)
      [*] = ;  lib/unit.script:4120        (SearchResourceInRadius: rndind)
      [*] = ;  lib/miscext2.script:420     (DoDamage: bHeadShot always fires, no random)
      [*] = ;  lib/miscext2.script:437     (DoDamage: headshot flat +12 + 2v1 dmg penalty -50% + fresh-unit -20% + wounded +5)
      [*] = ;  lib/miscext2.script:463     (DoDamage: 1.5 g-sec retarget delay on kill + fatigue -20% maxhp)
      [*] = ;  lib/unit.script:10788       (ApplyAttackPause: hp<3 -> min 1.5 g-sec attack delay, ~3x slowdown)
      [*] = ;  lib/unit.script:4796        (SearchEnemyInCellShips: rndind)
      [*] = ;  lib/unit.script:4872        (SearchEnemyInCell: rndind)
      [*] = ;  lib/unit.script:4992        (SearchEnemyScanCellsLongRange: dx)
      [*] = ;  lib/unit.script:4993        (SearchEnemyScanCellsLongRange: dy)
      [*] = ;  lib/unit.script:5127        (Anti-clump: ScanCellsLongRange K=4.0 + cap N>=3)
      [*] = ;  lib/unit.script:5191        (Anti-clump: ScanCells melee K=4.0 + cap N>=3)
      [*] = ;  lib/unit.script:5194        (Anti-clump: ScanCells ranged K=4.0 + cap N>=3)
      [*] = ;  lib/unit.script:8400        (Retarget gate: idle while attackdelay > 0)
      [*] = ;
      [*] = ;Each RNG patch precedes the `random` call with SetRandomKey(seed) derived from goHnd / attacker uniqrnd / position+plInd combined with gProgress.progresstick. All seed inputs persist across save/load.
   struct.end
