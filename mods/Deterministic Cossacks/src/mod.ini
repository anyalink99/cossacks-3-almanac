      [*] = ;v9: wounded +5 dmg (hp<50%) + near-death slow (hp<3 -> 1.5 g-sec min attackdelay). v8: fatigue/fresh-penalty extended to all kills (removed melee-only gate). v7: fatigue -20% maxhp per melee kill + fresh-unit penalty -20% dmg hp>80% melee. v6: 2v1 penalty -50% + retarget delay 1.5 g-sec. v5: headshot flat +12 + 2v1 -35% + retarget 0.5 g-sec + K->4.0. v4: K=0.8/1.0, cap N>=3, injured x2.5. v3/v2/v1: earlier iterations.
